name: Test and build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RADAR_DATABASE_URL: postgresql+psycopg://radar:ci_test_only@localhost:5432/radar_test
      RADAR_TEST_DATABASE_URL: postgresql+psycopg://radar:ci_test_only@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: python -m app.manage init
      - run: python -m alembic -c backend/alembic.ini check
      - run: python -m pytest backend/tests --basetemp="$RUNNER_TEMP/joyboyz-pytest" --cov=app --cov-report=term

  frontend-and-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - run: python3 scripts/setup_env.py
      - name: Keep container smoke test independent of external shops
        run: cp config/shops.ci.json config/shops.json
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Run packaged backend against isolated PostgreSQL
        run: bash scripts/test-containers.sh
      - run: docker compose up -d
      - run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/api/health
      - if: always()
        run: docker compose down -v
