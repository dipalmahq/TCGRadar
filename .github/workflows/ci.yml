name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RADAR_DATABASE_URL: postgresql+psycopg://radar:ci_test_only@localhost:5432/radar_test
      RADAR_TEST_DATABASE_URL: postgresql+psycopg://radar:ci_test_only@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: python -m app.manage init
      - run: python -m alembic -c backend/alembic.ini check
      - run: python -m pytest backend/tests --basetemp="$RUNNER_TEMP/joyboyz-pytest" --cov=app --cov-report=term

  frontend-and-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run build
      - run: python3 scripts/setup_env.py
      - name: Verify generated merchant configuration is committed
        run: git diff --exit-code -- compose.workers.yaml
      - name: Keep container smoke test independent of external shops
        run: cp config/shops.ci.json config/shops.json
      - run: python3 scripts/generate_merchant_workers.py
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Run packaged backend against isolated PostgreSQL
        run: bash scripts/test-containers.sh
      - run: docker compose up -d
      - run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/api/health
      - if: always()
        run: docker compose down -v

  deploy:
    name: Deploy production
    needs: [backend, frontend-and-container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://radar.joyboyz.de
    concurrency:
      group: joyboyz-production
      cancel-in-progress: false
    steps:
      - name: Deploy the tested main commit over restricted SSH
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/joyboyz_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/joyboyz_deploy" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/joyboyz_deploy"' EXIT
          ssh -i "$HOME/.ssh/joyboyz_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" | tee "$RUNNER_TEMP/joyboyz-deploy.log"
          if grep -q '^Skipped superseded commit;' "$RUNNER_TEMP/joyboyz-deploy.log"; then
            echo 'skipped=true' >> "$GITHUB_OUTPUT"
            echo 'Skipped superseded commit; the latest main run owns deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify public health after deployment
        if: steps.deploy.outputs.skipped != 'true'
        run: |
          curl --fail --retry 6 --retry-delay 5 --retry-connrefused https://radar.joyboyz.de/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' https://radar.joyboyz.de/api/offers)" = 401
          printf 'Deployed commit `%s` to https://radar.joyboyz.de\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
