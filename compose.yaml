name: joyboyz-tcg-radar

x-app: &app
  image: ${RADAR_IMAGE:-joyboyz-tcg-radar:local}
  build: .
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: &environment
    RADAR_DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:?Run scripts/setup_env.py first}@db:5432/radar
    RADAR_ENVIRONMENT: production
    RADAR_API_KEY: ${RADAR_API_KEY:?Run scripts/setup_env.py first}
    RADAR_SHOPS_FILE: /app/config/shops.json
    RADAR_FRONTEND_DIR: /app/frontend/dist
    RADAR_NOTIFICATIONS_ENABLED: ${RADAR_NOTIFICATIONS_ENABLED:-false}
    RADAR_DISCORD_WEBHOOK_URL: ${RADAR_DISCORD_WEBHOOK_URL:-}
    RADAR_TELEGRAM_BOT_TOKEN: ${RADAR_TELEGRAM_BOT_TOKEN:-}
    RADAR_TELEGRAM_CHAT_ID: ${RADAR_TELEGRAM_CHAT_ID:-}
    RADAR_USER_AGENT: ${RADAR_USER_AGENT:-JoyBoyzTCGRadar/0.1}
    RADAR_REQUEST_DELAY_SECONDS: ${RADAR_REQUEST_DELAY_SECONDS:-2}
    RADAR_STALE_AFTER_MINUTES: ${RADAR_STALE_AFTER_MINUTES:-1440}
    RADAR_REFRESH_INTERVAL_SECONDS: ${RADAR_REFRESH_INTERVAL_SECONDS:-1800}
    RADAR_WATCH_INTERVAL_SECONDS: ${RADAR_WATCH_INTERVAL_SECONDS:-300}
    RADAR_REFRESH_BATCH_SIZE: ${RADAR_REFRESH_BATCH_SIZE:-12}
    RADAR_HISTORY_RETENTION_DAYS: ${RADAR_HISTORY_RETENTION_DAYS:-90}
  volumes:
    - ./config:/app/config:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_env.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "app.manage", "init"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${RADAR_BIND_ADDRESS:-127.0.0.1}:${RADAR_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  worker:
    <<: *app
    profiles: ["legacy"]
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 90s

volumes:
  postgres-data:
