# Optional Ubuntu deployment behind Caddy. Run only after production approval.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RADAR_DOMAIN: ${RADAR_DOMAIN:?Set your domain before production deployment}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
